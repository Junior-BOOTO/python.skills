name: BOOTO ScanGrade AI V1 pilot tests
on:
  push:
    paths:
      - 'booto-scangrade-ai-v1/**'
      - '.github/workflows/scangrade-ai-v1-tests.yml'
  pull_request:
    paths:
      - 'booto-scangrade-ai-v1/**'
      - '.github/workflows/scangrade-ai-v1-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test booto-scangrade-ai-v1/tests/*.test.cjs
