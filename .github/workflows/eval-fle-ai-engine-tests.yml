name: Éval’FLE AI Engine — tests
on:
  push:
    paths:
      - 'eval-fle-ai-engine/**'
      - '.github/workflows/eval-fle-ai-engine-tests.yml'
  pull_request:
    paths:
      - 'eval-fle-ai-engine/**'
      - '.github/workflows/eval-fle-ai-engine-tests.yml'
  workflow_dispatch:
jobs:
  unit-and-export-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval-fle-ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q app.py src tests
      - name: Start Streamlit app
        run: |
          python -m streamlit run app.py --server.address 127.0.0.1 --server.port 8501 --server.headless true > /tmp/evalfle-streamlit.log 2>&1 &
          echo $! > /tmp/evalfle-streamlit.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/evalfle-streamlit.log
          exit 1
