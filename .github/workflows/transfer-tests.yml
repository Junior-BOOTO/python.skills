name: Transfer Cost Observatory tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transfer-cost-observatory
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Decimal calculations and validation tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Reproduce synthetic scenarios
        env:
          PYTHONPATH: src
        run: python -m transfer_cost compare --as-of 2026-10-12
