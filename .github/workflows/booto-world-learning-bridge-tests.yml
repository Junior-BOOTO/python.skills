name: BOOTO WORLD LEARNING BRIDGE — V1 integrated tests
on:
  push:
    paths:
      - 'booto-world-learning-bridge/**'
      - '.github/workflows/booto-world-learning-bridge-tests.yml'
  pull_request:
    paths:
      - 'booto-world-learning-bridge/**'
      - '.github/workflows/booto-world-learning-bridge-tests.yml'
  workflow_dispatch:
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booto-world-learning-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run integration tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/passport.js
          node --check game/src/mission.js
          node --check game/src/app.js
          node --check game/src/world.js
      - name: Build static website
        run: npm run build
      - name: Verify distribution
        run: |
          test -s dist/index.html
          test -s dist/game/index.html
          test -s dist/game/src/app.js
          test -s dist/src/passport.js
