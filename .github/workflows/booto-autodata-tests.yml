name: BOOTO AutoData Scientiste AI — tests
on:
  push:
    paths:
      - 'booto-autodata-scientiste-ai/**'
      - '.github/workflows/booto-autodata-tests.yml'
  pull_request:
    paths:
      - 'booto-autodata-scientiste-ai/**'
      - '.github/workflows/booto-autodata-tests.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booto-autodata-scientiste-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q src app
      - name: Tests
        run: python -m pytest -q
      - name: Streamlit smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          result = AppTest.from_file("app/main.py", default_timeout=45).run()
          assert not result.exception, [e.message for e in result.exception]
          print("Streamlit: démarrage V1 vérifié")
          PY
