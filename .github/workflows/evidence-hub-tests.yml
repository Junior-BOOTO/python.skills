name: Portfolio Evidence Hub tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-evidence-hub
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Behavior and local API tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Reproduce snapshot audit
        env:
          PYTHONPATH: src
        run: python -m evidence_hub audit --local-snapshot data/local-observations.json
