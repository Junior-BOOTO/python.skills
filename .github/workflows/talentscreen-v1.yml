name: BOOTO TalentScreen V1 verification
on:
  push:
    paths:
      - 'booto-talentscreen-ai-v1/**'
      - '.github/workflows/talentscreen-v1.yml'
  pull_request:
    paths:
      - 'booto-talentscreen-ai-v1/**'
      - '.github/workflows/talentscreen-v1.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test booto-talentscreen-ai-v1/tests/*.test.cjs
